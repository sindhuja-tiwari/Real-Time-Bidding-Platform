id: s14-pool-cut-bundled-with-deadline-raise
title: A deploy shrinks the pool and also raises the auction deadline

report: >
  Auction success rate dropped sharply shortly after the auction backend was
  deployed this afternoon. Identify the likely cause, show the supporting
  evidence, and test a remediation without touching the live system.

traffic:
  rps: 24
  baseline_seconds: 40
  incident_seconds: 60

steps:
  - at: 0
    action: deploy
    version: 1.3.5
    env:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
      AUCTION_GLOBAL_TIMEOUT_MS: "120"

ground_truth:
  category: db_pool_exhaustion
  component: backend SQLAlchemy connection pool (DB_POOL_SIZE / DB_MAX_OVERFLOW)
  summary: >
    v1.3.5 shrank the pool to 2 and raised the deadline to 120ms. The longer
    deadline makes each auction hold its connection slightly longer, but the
    break is the pool: requests queue for a connection and time out.
  causal_steps: [0]
  decoy_steps: []
  causal_settings: [DB_POOL_SIZE, DB_MAX_OVERFLOW]
  decoy_settings: [AUCTION_GLOBAL_TIMEOUT_MS]
  distinguishing_evidence:
    - pool acquire waits climb into seconds; bids are not cut short
  remediation:
    description: Roll the pool settings back.
    changes:
      - {kind: rollback_setting, setting: DB_POOL_SIZE}
      - {kind: rollback_setting, setting: DB_MAX_OVERFLOW}
    expected_min_success_rate: 0.9
