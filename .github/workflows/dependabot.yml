version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/backend"
      - "/dsp-simulator"
      - "/evidenceops"
      - "/load-tests"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm          # frontend (package-lock.json is committed)
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/dsp-simulator"
      - "/frontend"
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose   # postgres, redis, kafka, prometheus, grafana
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
