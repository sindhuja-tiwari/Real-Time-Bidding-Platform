name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  evidenceops-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evidenceops/requirements.txt
      - run: pip install -r evidenceops/requirements.txt
      - name: Harness unit tests (no Docker, no API key)
        run: pytest -q evidenceops/tests
      - name: Validate scenario definitions
        run: python -m evidenceops validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file parses and resolves
        run: |
          cp .env.example .env
          docker compose config --quiet
